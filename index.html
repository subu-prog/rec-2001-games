<script>
const D={"date":"30 October 2026","wordle":{"answer":"PRABHJOT","registered":["ABHINAV","AJAY","AMIT","AMRUTA","ANUJ","APURBA","ARUN","BALPREET","CHANDRIKA","CHITTA","DEBA","DEBASHIS","DEEPANJAN","DEVENDRA","DIPANWITA","DIVYARAJSINH","GAUTAM","GIRIJA","JOYDEEP","KARTHIK","KIREET","KULBHUSHAN","MALAY","MAMATA","MANAS","MANISH","MANOJ","MUKUNDA","NIVEDITA","PARIMITA","PRABHJOT","PRADEEP","PRAKASH","PRASANTA","PRAVEEN","PUJA","RAGHAVENDRAN","RAKHI","RASHMI","ROHIT","RONITA","SACHIN","SAGAR","SANDEEP","SANJUKTA","SANTOSH","SATYA","SEEMA","SHIV","SHOBHIT","SOMA","SRINIVASA","SUBHADRA","SUBHANKAR","SUDHIRA","SUJIT","SUMANTA","SUMIT","SUNITI","SWATI","SWAYAM","SWETHA","UMESH","VEERA","YOGESH"]},"detective":{"ans":"Srinivasa","ok":["srinivasa","srinivas","shrinivas","shrinivasa","srinivaas"],"hints":["This name carries a goddess inside it.","Sri (Lakshmi) plus nivasa (abode): where Lakshmi resides.","It is another name of Vishnu as Venkateswara, the lord of Tirupati.","Beloved in Telugu, Kannada and Tamil homes, and worn proudly in our batch too.","Nine letters; a whole temple town answers to it."],"note":"Srinivasa means 'abode of Sri (Lakshmi)' and is another name of Vishnu as Venkateswara of Tirupati.","sourceNote":"These clues explain the name's meaning, not the batchmate's personality.","sources":[{"label":"Prokerala: Srinivasa","url":"https://www.prokerala.com/kids/baby-names/srinivasa-23852.html"}]},"weave":{"words":[{"w":"KULBHUSHAN","clue":"The ornament of the family: kul plus bhushan."},{"w":"BALPREET","clue":"Bal (strength) plus preet (love): the power of love."},{"w":"DEEPANJAN","clue":"One who brings light, from deepa, the lamp."},{"w":"DIPANWITA","clue":"Lit by lamps - a name that is pure Diwali."}],"grid":["PANJAN","EITNSU","EWAAHH","DNIDLB","TAPKUB","EERPLA"],"note":"Kulbhushan: ornament of the family. Balpreet: strength and love. Deepanjan: one who brings light. Dipanwita: lit by lamps. These meanings describe names, not people."},"quizzes":[{"id":"tech-trivia-1","title":"404 Dignity Not Found","subtitle":"The Ultimate Tech & Internet Trivia","date":"15 October 2026","blurb":"Ten absurd, iconic and true questions from tech and internet history.","questions":[{"id":1,"category":"Search Wars","question":"What has historically been the single most-searched word on Microsoft's Bing search engine?","options":["Google","Facebook","Weather","YouTube"],"correct":0,"trivia":"Google's legal team actually submitted this data in European Union antitrust court to prove that consumers choose Google by conscious preference, not because of default browser dominance! (This was Google's claim in its 2021 EU court filing.)"},{"id":2,"category":"Viral Origins","question":"What iconic pop-culture moment in 2000 caused Google engineers to hurriedly invent Google Image Search?","options":["Jennifer Lopez's green Versace Grammy dress","Britney Spears dancing with an albino Python","The launch of the colorful translucent iMacs","The Dot-Com crash front-page headlines"],"correct":0,"trivia":"Former Google CEO Eric Schmidt confirmed that J.Lo's plunging green dress was the most popular search query they had ever seen, but users were frustrated that results were just text links. Image search was born!"},{"id":3,"category":"Branding Blunders","question":"When Larry Page and Sergey Brin started building their search engine in 1996 at Stanford, what was its original name?","options":["BackRub","PageRank Express","The Web Crawler","BrainSoup"],"correct":0,"trivia":"It was called 'BackRub' because the core algorithm analyzed backlinks across the web to gauge site importance. Be glad you don't have to tell your coworkers to 'BackRub that recipe'."},{"id":4,"category":"Hardware Hacks","question":"Why was the world's very first webcam set up by researchers at Cambridge University in 1991?","options":["To monitor a coffee pot so they didn't walk to an empty pot","To catch someone stealing computer components","To livestream a student's high-tech hamster cage","To observe server room temperature gauges"],"correct":0,"trivia":"Known as the 'Trojan Room coffee pot', a camera pointed at it let Cambridge computer scientists check the pot from their desks, so nobody wasted a trip down the corridor for an empty one. It is widely credited as the world's first webcam."},{"id":5,"category":"Silicon Valley Lore","question":"What was Jeff Bezos's original choice for Amazon's company name before his lawyer misheard it?","options":["Cadabra","Relentless","EarthBooks","EveryDepot"],"correct":0,"trivia":"Bezos loved 'Cadabra' (as in abracadabra), but when his lawyer misheard it as 'Cadaver' (a dead corpse), Bezos reconsidered. He also bought Relentless.com—which still redirects straight to Amazon today!"},{"id":6,"category":"Apple Ruthlessness","question":"How did Steve Jobs prove to Apple engineers that the original iPod prototype could still be made smaller?","options":["He dropped it in a fish tank and pointed to air bubbles","He ran it over with his silver Mercedes SL55","He sliced its casing open with a chef's knife","He tossed it out a boardroom window into a fountain"],"correct":0,"trivia":"As the story goes, Jobs dropped the prototype into an aquarium in front of his engineers. When bubbles floated up, he pointed out that air bubbles meant empty space, and told them to make it smaller. This is a much-repeated anecdote, not a documented record."},{"id":7,"category":"E-Commerce Roots","question":"In 1995, Pierre Omidyar launched eBay (then AuctionWeb). What was the very first item ever sold?","options":["A broken laser pointer for $14.83","A half-eaten grilled cheese sandwich","A vintage Superman comic book","A box of floppy disks with Windows 95"],"correct":0,"trivia":"Omidyar was so astonished that he emailed the winning bidder to verify if he understood the laser pointer was broken. The buyer, as the tale is usually told, collected broken laser pointers."},{"id":8,"category":"The ARPANET Crash","question":"In 1969, the first ARPANET message (the precursor to the Internet) was meant to be 'LOGIN'. What was actually sent before it crashed?","options":["LO","HELLO","LOG","404"],"correct":0,"trivia":"Programmer Charley Kline typed 'L' (confirmed by telephone), then 'O' (confirmed), and on the letter 'G', the SDS Sigma 7 mainframe crashed! The first internet message was literally 'LO' (as in 'Lo and behold')."},{"id":9,"category":"Video Streaming","question":"What was the very first video uploaded to YouTube on April 23, 2005?","options":["\"Me at the zoo\" (Jawed Karim at the elephant exhibit)","\"Keyboard Cat takes the stage\"","\"Test Video #1: Roommate with guitar\"","\"Office Tour in San Mateo, California\""],"correct":0,"trivia":"The short video features YouTube co-founder Jawed Karim remarking that elephants 'have really, really, really long trunks, and that's cool.' It is recognized as the first video uploaded to YouTube."},{"id":10,"category":"The Ultimate Blunder","question":"In the late 1990s, Larry and Sergey tried to sell Google's search technology to a rival portal so they could finish their PhDs. About how much were they reportedly asking?","options":["$1 Million","$10 Million","$500,000","$100,000"],"correct":0,"trivia":"Reports say the founders offered Google for about $1 million to portals such as Excite and AltaVista, and nobody bought. Excite's backer Vinod Khosla later said the price had come down to under $1 million. In 2002, Yahoo offered roughly $3 billion for Google, and Google declined."}]},{"id":"india-quiz-1","title":"Incredible India","subtitle":"The Great India Quiz","date":"19 October 2026","blurb":"Ten questions on India's places, firsts, words and wonders, with a couple straight from Odisha.","questions":[{"id":1,"category":"Wild India","question":"The entire wild population of Asiatic lions lives in just one place on Earth. Where?","options":["Gir National Park, Gujarat","Ranthambore National Park, Rajasthan","Kaziranga National Park, Assam","Bandhavgarh National Park, Madhya Pradesh"],"correct":0,"trivia":"Gir in Gujarat is the last home of the Asiatic lion. From barely a dozen left in the early 1900s, careful protection brought the count to 891 lions in the 2025 census."},{"id":2,"category":"The Constitution","question":"How many languages are officially recognised in the Eighth Schedule of the Indian Constitution?","options":["22","18","15","29"],"correct":0,"trivia":"The schedule started with 14 languages in 1950. Sindhi joined in 1967, Konkani, Manipuri and Nepali in 1992, and Bodo, Dogri, Maithili and Santali took it to 22 in 2003."},{"id":3,"category":"Space","question":"In August 2023, Chandrayaan-3 made India the first country to land a spacecraft near which part of the Moon?","options":["The south polar region","The north pole","The far side's equator","The Sea of Tranquility"],"correct":0,"trivia":"India also became the fourth nation to soft-land on the Moon, after the Soviet Union, the United States and China. The south polar region is prized for its frozen water."},{"id":4,"category":"Mathematics","question":"Which ancient Indian mathematician's 628 CE text Brahmasphutasiddhanta first treated zero as a number with its own arithmetic rules?","options":["Brahmagupta","Aryabhata","Bhaskara II","Panini"],"correct":0,"trivia":"Brahmagupta defined zero as the result of subtracting a number from itself, then wrote rules for adding, subtracting and multiplying with it. He even tried dividing by zero."},{"id":5,"category":"Olympics","question":"Abhinav Bindra won India's first individual Olympic gold medal, at Beijing 2008, in which sport?","options":["Shooting","Wrestling","Boxing","Badminton"],"correct":0,"trivia":"His near-perfect 10.8 on the last shot of the 10m air rifle final edged out China's Zhu Qinan. India's eight earlier hockey golds were all team events."},{"id":6,"category":"Engineering Marvels","question":"The Chenab Bridge, the world's highest railway bridge at 359 metres above the riverbed, stands in which Indian union territory?","options":["Jammu and Kashmir","Himachal Pradesh","Uttarakhand","Arunachal Pradesh"],"correct":0,"trivia":"The steel arch bridge in Reasi district stands taller than the Eiffel Tower and carries trains on the line into the Kashmir Valley."},{"id":7,"category":"Odisha","question":"The Konark Sun Temple, a UNESCO World Heritage Site, was built as a giant stone chariot of which deity?","options":["Surya, the Sun God","Vishnu","Shiva","Indra"],"correct":0,"trivia":"The 13th-century temple chariot is pulled by seven horses on 24 carved wheels, each about 3 metres across, marking the cycle of months."},{"id":8,"category":"Odisha","question":"Rourkela, our own reunion city, got India's first public sector integrated steel plant in the 1950s, built with collaboration from which country?","options":["West Germany","The Soviet Union","The United Kingdom","Japan"],"correct":0,"trivia":"Rourkela Steel Plant began production in 1959 with a consortium led by German firms Krupp and Demag. Bhilai got the Soviet plant and Durgapur the British one."},{"id":9,"category":"Words","question":"The English word 'juggernaut', meaning an unstoppable force, comes from which Odisha tradition?","options":["The Jagannath Rath Yatra of Puri","The Durga Puja of Kolkata","The Kumbh Mela of Prayagraj","The Mysuru Dasara procession"],"correct":0,"trivia":"British observers in the early 1800s watched Lord Jagannath's massive chariot roll through Puri and turned 'Jagannath' into 'juggernaut'."},{"id":10,"category":"Firsts","question":"Who was the first Indian to travel to space?","options":["Rakesh Sharma","Kalpana Chawla","Sunita Williams","Ravish Malhotra"],"correct":0,"trivia":"Squadron Leader Rakesh Sharma flew aboard the Soviet Soyuz T-11 in April 1984; Ravish Malhotra trained as his backup. Asked how India looked from space, Sharma replied: Sare Jahan Se Accha."}]},{"id":"dussehra-quiz-1","title":"Dussehra Quiz","subtitle":"Ravana, Rama and the festival of victory","date":"20 October 2026","blurb":"Ten questions on Dussehra: the story, the bonfires and the great celebrations.","questions":[{"id":1,"category":"The Big Story","question":"Dussehra (Vijayadashami) celebrates Lord Rama's victory over which king?","options":["Ravana","Kansa","Hiranyakashipu","Mahishasura"],"correct":0,"trivia":"Rama defeated the ten-headed Ravana of Lanka, who had abducted Sita. The day stands for good winning over evil."},{"id":2,"category":"Ten Heads","question":"Ravana is also called Dashanana. How many heads does that name refer to?","options":["Ten","Seven","Nine","Twelve"],"correct":0,"trivia":"Dasha means ten and anana means face. Many people also read Dussehra as Dasha-hara, the removal of the ten heads."},{"id":3,"category":"The Bonfire","question":"Along with Ravana, which two effigies are traditionally burned on Dussehra evening?","options":["Kumbhakarna and Meghnad","Vibhishana and Hanuman","Sugriva and Angad","Jatayu and Sampati"],"correct":0,"trivia":"Ravana's brother Kumbhakarna and son Meghnad (Indrajit) stand beside him in the great effigies of Ramlila grounds."},{"id":4,"category":"The Turncoat","question":"Which of Ravana's brothers sided with Rama?","options":["Vibhishana","Kumbhakarna","Khara","Maricha"],"correct":0,"trivia":"Vibhishana advised Ravana to return Sita, was turned away, and joined Rama. Rama later crowned him king of Lanka."},{"id":5,"category":"Royal Parade","question":"Which city is famed for its ten-day royal Dasara, ending with a procession of decorated elephants?","options":["Mysuru","Jaipur","Udaipur","Hyderabad"],"correct":0,"trivia":"Mysuru's Dasara, centred on the Mysore Palace and the Jamboo Savari procession, is among India's most famous festivals."},{"id":6,"category":"Hill Festival","question":"In which state does the Kullu Dussehra begin on Vijayadashami and go on for about a week?","options":["Himachal Pradesh","Uttarakhand","Jammu and Kashmir","Sikkim"],"correct":0,"trivia":"While Ravana is being burned elsewhere, Kullu's festival begins, with hundreds of village deities brought to honour Lord Raghunath."},{"id":7,"category":"The Epic","question":"In which language did Tulsidas write the Ramcharitmanas, the retelling of the Ramayana performed in many Ramlilas?","options":["Awadhi","Maithili","Braj Bhasha","Bengali"],"correct":0,"trivia":"Tulsidas wrote it in the 16th century in Awadhi, which is why it reached ordinary homes across northern India."},{"id":8,"category":"World Recognition","question":"In 2008 UNESCO added which Dussehra-season tradition, the staged performance of the Ramayana, to its Intangible Cultural Heritage list?","options":["Ramlila","Yakshagana","Kuchipudi","Pandavani"],"correct":0,"trivia":"Ramlila is performed over several nights before Dussehra, and the story ends with Ravana's defeat."},{"id":9,"category":"Durga Time","question":"In 2021 UNESCO inscribed the Durga Puja of which city on its Intangible Cultural Heritage list?","options":["Kolkata","Guwahati","Cuttack","Patna"],"correct":0,"trivia":"Kolkata's Durga Puja was recognised for its community pandals, idol making and art."},{"id":10,"category":"Odisha Special","question":"Which Odisha city, close to the Mahanadi, is famed for Durga Puja decorations made in silver filigree (tarakasi)?","options":["Cuttack","Sambalpur","Berhampur","Balasore"],"correct":0,"trivia":"Cuttack's Durga Puja is known for its silver filigree work, and the city is also known as the silver city."}]},{"id":"bollywood-quiz-2001","title":"Class of 2001: The Year in Bollywood","subtitle":"The year you graduated, on the silver screen","date":"21 October 2026","blurb":"Ten questions from the Bollywood of 2001 - the year our batch walked out of REC.","questions":[{"id":1,"category":"The Great Clash","question":"Two of 2001's biggest films released on the very same day, 15 June 2001. Which pair?","options":["Lagaan and Gadar: Ek Prem Katha","Dil Chahta Hai and Kabhi Khushi Kabhie Gham","Lagaan and Dil Chahta Hai","Gadar and Kabhi Khushi Kabhie Gham"],"correct":0,"trivia":"Lagaan and Gadar opened on 15 June 2001. Gadar powered ahead at the box office while Lagaan took the awards road all the way to the Oscars."},{"id":2,"category":"The Oscars","question":"Lagaan was only the third Indian film ever nominated for the Oscar for Best Foreign Language Film. Which two came before it?","options":["Mother India and Salaam Bombay!","Guide and Pather Panchali","Mughal-e-Azam and Pyaasa","Shwaas and Harishchandrachi Factory"],"correct":0,"trivia":"Mother India (1957) and Salaam Bombay! (1988) were the earlier two. Lagaan remains, as of 2025, the most recent Indian nominee in the category."},{"id":3,"category":"Cricket and Taxes","question":"In Lagaan, what must Bhuvan's villagers win to escape paying lagaan (tax) for three years?","options":["A cricket match against the British officers","A wrestling bout with Captain Russell","A harvest race against the neighbouring village","A kabaddi final at the cantonment"],"correct":0,"trivia":"Set in 1893, the film turns on Captain Russell's arrogant bet: beat his team at cricket and the tax goes for three years, lose and it triples."},{"id":4,"category":"Directors' Debuts","question":"Dil Chahta Hai (August 2001), the film that redefined friendship on screen, was whose directorial debut?","options":["Farhan Akhtar","Zoya Akhtar","Karan Johar","Nikhil Advani"],"correct":0,"trivia":"Farhan Akhtar wrote and directed it for the newly formed Excel Entertainment, with Ritesh Sidhwani producing. It released on 10 August 2001."},{"id":5,"category":"The Music","question":"Dil Chahta Hai's era-defining soundtrack was composed by which music trio?","options":["Shankar-Ehsaan-Loy","Vishal-Shekhar","Jatin-Lalit","Nadeem-Shravan"],"correct":0,"trivia":"The trio had composed before, but Dil Chahta Hai made Shankar-Ehsaan-Loy a household name for a whole generation."},{"id":6,"category":"Family Drama","question":"In Kabhi Khushi Kabhie Gham (December 2001), Amitabh and Jaya Bachchan play Yash and Nandini Raichand. Who plays their elder son Rahul?","options":["Shah Rukh Khan","Hrithik Roshan","Saif Ali Khan","Abhishek Bachchan"],"correct":0,"trivia":"Hrithik Roshan plays the younger son Rohan, and Kajol plays Rahul's love, Anjali."},{"id":7,"category":"Partition Epic","question":"Gadar: Ek Prem Katha, the year's biggest blockbuster, is set during which historical event?","options":["The Partition of India in 1947","The 1971 war","The revolt of 1857","The Emergency of 1975"],"correct":0,"trivia":"Sunny Deol's Tara Singh and that uprooted hand pump became instant legend; the love story unfolds across the Partition."},{"id":8,"category":"National Awards","question":"Which 2001 film won the National Film Award for Best Popular Film Providing Wholesome Entertainment?","options":["Lagaan","Gadar","Dil Chahta Hai","Kabhi Khushi Kabhie Gham"],"correct":0,"trivia":"At the 49th National Film Awards, Lagaan swept eight awards, including Best Popular Film."},{"id":9,"category":"Critical Acclaim","question":"Tabu won the National Film Award for Best Actress for which gritty 2001 Madhur Bhandarkar film?","options":["Chandni Bar","Astitva","Page 3","Corporate"],"correct":0,"trivia":"She shared the award with Shobana (Mitr, My Friend). Chandni Bar also won Best Film on Other Social Issues, plus both supporting-actor prizes."},{"id":10,"category":"Star Launch","question":"Which 2001 film launched Tusshar Kapoor, son of Jeetendra, opposite Kareena Kapoor?","options":["Mujhe Kucch Kehna Hai","Yaadein","Ajnabee","Pyaar Tune Kya Kiya"],"correct":0,"trivia":"Mujhe Kucch Kehna Hai released on 25 May 2001; Tusshar's screen career starts right there, in your graduation year."}]},{"id":"rec-quiz-1","title":"REC Rourkela Quiz","subtitle":"The college we called home","date":"23 October 2026","blurb":"Ten questions on our very own REC: the campus, the history and the legends of Rourkela.","questions":[{"id":1,"category":"Founding Day","question":"REC Rourkela was established on which date?","options":["15 August 1961","26 January 1960","15 August 1965","2 October 1961"],"correct":0,"trivia":"The college began on Independence Day 1961 - it shares its birthday with the nation."},{"id":2,"category":"The Stone","question":"Who laid the foundation stone of REC Rourkela?","options":["Jawaharlal Nehru","Dr. S. Radhakrishnan","Biju Patnaik","Dr. Homi Bhabha"],"correct":0,"trivia":"India's first Prime Minister laid the foundation stone of our campus."},{"id":3,"category":"The Gift of Land","question":"Which Chief Minister of Odisha provided the land, roughly 650 acres, for the college?","options":["Biju Patnaik","Nandini Satpathy","Harekrushna Mahatab","Nilamani Routray"],"correct":0,"trivia":"Biju Patnaik gave the land; the central library, functional since 1965, is also named after him."},{"id":4,"category":"National Importance","question":"In which year was NIT Rourkela declared an Institute of National Importance by an Act of Parliament?","options":["2007","2002","1961","2010"],"correct":0,"trivia":"The NIT Act 2007 gave all NITs a common statutory framework; ours was declared on 15 August 2007."},{"id":5,"category":"Name Change","question":"REC Rourkela was renamed National Institute of Technology on 26 June of which year?","options":["2002","2003","2001","2005"],"correct":0,"trivia":"We graduated as RECians in 2001; the college became NIT Rourkela the very next year, on 26 June 2002."},{"id":6,"category":"The REC Family","question":"How many Regional Engineering Colleges were rechristened as NITs?","options":["17","8","31","12"],"correct":0,"trivia":"Seventeen RECs became NITs; the family has since grown to 31 NITs across India."},{"id":7,"category":"Steel City","question":"REC/NIT Rourkela sits in a city famous for which industry?","options":["Steel","Textiles","Tea","Shipbuilding"],"correct":0,"trivia":"Rourkela is Odisha's steel city, home to one of SAIL's biggest plants."},{"id":8,"category":"Tech Fest","question":"The institute's annual techno-management fest is called...","options":["Innovision","Nitrutsav","Vriddhi","Spring Fest"],"correct":0,"trivia":"Innovision is the techno-management fest; Spring Fest belongs to IIT Kharagpur."},{"id":9,"category":"Sports Fest","question":"Which of these is the institute's national-level sports fest?","options":["Vriddhi","Udghosh","Spree","Aarohan"],"correct":0,"trivia":"Vriddhi is NIT Rourkela's sports fest; Udghosh (IIT Kanpur) and Spree (BITS Goa) belong elsewhere."},{"id":10,"category":"Student Voice","question":"Founded in 2006, the institute's student media body shares its name with which day of the week?","options":["Monday","Friday","Sunday","Wednesday"],"correct":0,"trivia":"Monday Morning has published campus news every week since 2006 - after our time, but very much part of the college now."}]},{"id":"fun-trivia-1","title":"The Fun Trivia Mixer","subtitle":"Ten silly-smart questions for a Saturday","date":"24 October 2026","blurb":"No syllabus, no preparation, no mercy: ten gloriously useless facts to start the weekend.","questions":[{"id":1,"category":"Kitchen Archaeology","question":"Which food, found sealed in ancient Egyptian tombs, is famously still safe to eat thousands of years later?","options":["Honey","Salted fish","Olive oil","Dried figs"],"correct":0,"trivia":"Archaeologists have tasted 3,000-year-old honey from Egyptian tombs and found it perfectly edible."},{"id":2,"category":"Bird Business","question":"A group of flamingos is called a...","options":["Flamboyance","Parliament","Murder","Gaggle"],"correct":0,"trivia":"A flamboyance of flamingos. Owls get a parliament and crows get a murder - birds have the best HR department."},{"id":3,"category":"Space Race","question":"As of 2025, which planet has the most confirmed moons, at 274?","options":["Saturn","Jupiter","Uranus","Neptune"],"correct":0,"trivia":"Saturn pulled ahead with 128 new moons announced in March 2025, taking its confirmed total to 274."},{"id":4,"category":"Word Nerd","question":"The fear of long words is ironically named...","options":["Hippopotomonstrosesquippedaliophobia","Arachibutyrophobia","Pneumonoultramicroscopicsilicovolcanoconiosis","Sesquipedalianism"],"correct":0,"trivia":"Yes, the fear of long words is a very long word. Whoever named it had a cruel sense of humour."},{"id":5,"category":"Old Inventions","question":"Which country invented paper?","options":["China","Egypt","India","Greece"],"correct":0,"trivia":"Paper was invented in China, traditionally credited to the court official Cai Lun around 105 AD."},{"id":6,"category":"Under the Sea","question":"How many hearts does an octopus have?","options":["Three","One","Two","Eight"],"correct":0,"trivia":"Three hearts, nine brains and blue blood - the octopus is showing off."},{"id":7,"category":"Breath Holders","question":"Which animal can hold its breath longer than a dolphin?","options":["The sloth","The penguin","The sea otter","The crocodile"],"correct":0,"trivia":"Sloths can slow their heart rate and hold their breath for up to 40 minutes, beating dolphins comfortably."},{"id":8,"category":"Bathroom Science","question":"Which animal produces cube-shaped droppings?","options":["The wombat","The koala","The capybara","The platypus"],"correct":0,"trivia":"The wombat's cube-shaped poop stops it rolling away, so it can mark its territory neatly."},{"id":9,"category":"Keyboard Tricks","question":"Which common 10-letter word can be typed using only the top row of a QWERTY keyboard?","options":["Typewriter","Perpetuity","Television","Repurpose"],"correct":0,"trivia":"TYPEWRITER uses only QWERTYUIOP letters. A fitting tribute to the machine itself."},{"id":10,"category":"Berry Confusing","question":"Botanically speaking, which of these IS a true berry?","options":["Banana","Strawberry","Raspberry","Cherry"],"correct":0,"trivia":"Bananas are berries; strawberries and raspberries are not. Botany has no respect for breakfast."}]},{"id":"year-2001-rewind","title":"Class of 2001: The Year We Graduated","subtitle":"The world as it was, twenty-five years ago","date":"25 October 2026","blurb":"Ten questions on the year we threw our hats in the air. Warning: may cause extreme nostalgia.","questions":[{"id":1,"category":"On This Very Day","question":"Which operating system launched exactly 25 years ago today, on 25 October 2001, and went on to run half the world's PCs?","options":["Windows XP","Windows 2000","Mac OS X","Windows ME"],"correct":0,"trivia":"Windows XP shipped on 25 October 2001. Many of us wrote our first code on it - and some offices still refuse to let it go."},{"id":2,"category":"Two Days Ago, 25 Years Back","question":"Apple launched a device on 23 October 2001 promising '1,000 songs in your pocket'. Which one?","options":["The iPod","The iPhone","The iMac","The Walkman"],"correct":0,"trivia":"The first iPod held 5GB of music. The iPhone was still six years away."},{"id":3,"category":"The Free Encyclopedia","question":"Which website, launched on 15 January 2001, became the world's largest encyclopedia written entirely by volunteers?","options":["Wikipedia","Britannica Online","Google Scholar","About.com"],"correct":0,"trivia":"Wikipedia began as a side project and now has more articles than any encyclopedia in history."},{"id":4,"category":"Republic Day Tragedy","question":"A devastating earthquake struck Bhuj in Gujarat on which Indian national day in 2001?","options":["Republic Day, 26 January","Independence Day, 15 August","Gandhi Jayanti, 2 October","Diwali"],"correct":0,"trivia":"The Bhuj earthquake struck on 26 January 2001, while the country marked Republic Day."},{"id":5,"category":"The Greatest Comeback","question":"At Eden Gardens in March 2001, India beat Australia after being forced to follow on, powered by whose epic 281?","options":["VVS Laxman","Rahul Dravid","Sachin Tendulkar","Sourav Ganguly"],"correct":0,"trivia":"Laxman's 281 with Dravid's 180 ended Australia's 16-Test winning streak. Many still call it India's greatest Test."},{"id":6,"category":"Magic Arrives","question":"The first Harry Potter film hit cinemas in November 2001. What was it called in India?","options":["Harry Potter and the Philosopher's Stone","Harry Potter and the Sorcerer's Stone","Harry Potter and the Chamber of Secrets","Harry Potter and the Half-Blood Prince"],"correct":0,"trivia":"Only the US release renamed it 'Sorcerer's Stone'; India got the original Philosopher's Stone."},{"id":7,"category":"A Failed Handshake","question":"The July 2001 summit in Agra between Atal Bihari Vajpayee and which Pakistani leader ended without an agreement?","options":["Pervez Musharraf","Nawaz Sharif","Benazir Bhutto","Asif Ali Zardari"],"correct":0,"trivia":"The Agra Summit of July 2001 saw Vajpayee and Musharraf talk for days, but no joint declaration emerged."},{"id":8,"category":"Middle-earth Opens","question":"Peter Jackson's first Lord of the Rings film released in December 2001. Its title?","options":["The Fellowship of the Ring","The Two Towers","The Return of the King","The Hobbit"],"correct":0,"trivia":"The Fellowship of the Ring arrived in December 2001 and turned a whole generation into Tolkien fans."},{"id":9,"category":"Global Trade","question":"Which country officially joined the World Trade Organization on 11 December 2001, reshaping the world economy?","options":["China","India","Russia","Brazil"],"correct":0,"trivia":"China's WTO entry on 11 December 2001, after 15 years of talks, changed global manufacturing forever."},{"id":10,"category":"Corporate Collapse","question":"Which American energy giant filed for bankruptcy on 2 December 2001, becoming a byword for accounting fraud?","options":["Enron","WorldCom","Lehman Brothers","Arthur Andersen"],"correct":0,"trivia":"Enron's 2 December 2001 bankruptcy was then the largest in US history and swept away auditor Arthur Andersen with it."}]},{"id":"nit-rourkela-quiz-1","title":"NIT Rourkela: Know Your College","subtitle":"How well do you know the campus we called home?","date":"26 October 2026","blurb":"Ten questions on the history of our college, from REC to NIT. No attendance taken, but bragging rights apply.","questions":[{"id":1,"category":"Founding Day","question":"Our college was founded on 15 August 1961 under what name?","options":["Regional Engineering College, Rourkela","Rourkela Institute of Technology","Odisha College of Engineering","National Institute of Technology, Rourkela"],"correct":0,"trivia":"It began as Regional Engineering College, Rourkela on Independence Day 1961 - one of the RECs set up across India."},{"id":2,"category":"The Big Upgrade","question":"In which year did REC Rourkela become NIT Rourkela with deemed university status?","options":["2002","1998","2007","2010"],"correct":0,"trivia":"The Government of India elevated it on 26 June 2002, while we were still fresh out of campus."},{"id":3,"category":"Steel City","question":"NIT Rourkela's campus sits in a city famous for which industry?","options":["Steel","Textiles","Oil refining","Automobiles"],"correct":0,"trivia":"Rourkela is the steel city, home to the Rourkela Steel Plant run by SAIL."},{"id":4,"category":"Room to Roam","question":"The NIT Rourkela campus spreads over roughly how much land?","options":["262 hectares","62 hectares","1200 hectares","85 hectares"],"correct":0,"trivia":"262 hectares, about 648 acres, of hostels, halls and lecture halls - enough walking to skip leg day."},{"id":5,"category":"National Importance","question":"In which year did Parliament pass the NIT Act declaring the NITs Institutes of National Importance?","options":["2007","2002","1995","2015"],"correct":0,"trivia":"The NIT Act of 2007 took effect on 15 August that year and governs all NITs."},{"id":6,"category":"Today's Ticket In","question":"B.Tech admission to NIT Rourkela today is through which exam?","options":["JEE Main","NEET","CAT","GATE"],"correct":0,"trivia":"JEE Main it is - GATE is for M.Tech, CAT for management, NEET for medicine."},{"id":7,"category":"Our Ticket In","question":"Before JEE Main, admission to the NITs (including ours) was through which exam?","options":["AIEEE","IIT-JEE","CET","Olympiad"],"correct":0,"trivia":"The All India Engineering Entrance Examination, AIEEE, was the gateway until JEE Main replaced it in 2013."},{"id":8,"category":"Fifty Candles","question":"In which year did the institute celebrate its golden jubilee?","options":["2011","2001","2016","2021"],"correct":0,"trivia":"Founded in 1961, the college turned fifty in 2011 - a decade after we graduated."},{"id":9,"category":"Who Pays the Bills","question":"The NITs are centrally funded institutes under which ministry?","options":["Ministry of Education","Ministry of Steel","Ministry of Science and Industry","Ministry of Skill Development"],"correct":0,"trivia":"The Ministry of Education, formerly MHRD, funds all NITs - not the Ministry of Steel, tempting as that sounds."},{"id":10,"category":"Family Tree","question":"Before they were NITs, most of today's older NITs were known as what?","options":["Regional Engineering Colleges","State Polytechnics","Central Universities","Indian Institutes of Science"],"correct":0,"trivia":"Almost every old NIT began life as an REC, created to spread technical education across the regions."}]},{"id":"india-quiz-2","title":"Incredible India, Round 2","subtitle":"More marvels from the land we call home","date":"27 October 2026","blurb":"Ten more questions on India's records, firsts and quirks. Round 1 was just the warm-up.","questions":[{"id":1,"category":"Song of the Nation","question":"Jana Gana Mana, written by Rabindranath Tagore, was first sung at an Indian National Congress session in which year?","options":["1911","1947","1905","1950"],"correct":0,"trivia":"It was first sung on 27 December 1911 at the Calcutta session, decades before becoming the anthem."},{"id":2,"category":"Longest Within","question":"Which is the longest river that flows entirely within India?","options":["Godavari","Ganga","Yamuna","Narmada"],"correct":0,"trivia":"The Godavari runs about 1465 km, all within India; the Ganga is longer overall but crosses into Bangladesh."},{"id":3,"category":"Special Delivery","question":"The world's only floating post office sits on which lake?","options":["Dal Lake","Chilika Lake","Vembanad Lake","Loktak Lake"],"correct":0,"trivia":"The post office floats on Dal Lake in Srinagar, delivering mail by shikara."},{"id":4,"category":"Iron Giant","question":"Indian Railways runs the world's fourth-largest railway network. How does it rank in Asia?","options":["Second, after China","First","Third","Fourth"],"correct":0,"trivia":"Only the United States, China and Russia have larger networks, so India is second in Asia."},{"id":5,"category":"Checkmate, Historians","question":"Chess traces its origin to which 6th-century Indian game?","options":["Chaturanga","Pachisi","Kabaddi","Chaupar"],"correct":0,"trivia":"Chaturanga, named for the four divisions of an army, travelled to Persia and became chess."},{"id":6,"category":"Red Planet, First Try","question":"In 2014, India became the first country to reach Mars orbit on its very first attempt, with which mission?","options":["Mangalyaan","Chandrayaan-2","Gaganyaan","Aditya-L1"],"correct":0,"trivia":"Mangalyaan entered Mars orbit on 24 September 2014 - a world first on debut, at a famously frugal budget."},{"id":7,"category":"Wettest of All","question":"Which Meghalaya village is recorded as the wettest place on Earth?","options":["Mawsynram","Cherrapunji","Shillong","Tura"],"correct":0,"trivia":"Mawsynram edges out neighbour Cherrapunji with about 11,871 mm of rain a year."},{"id":8,"category":"Lights, Camera, 1913","question":"India's first full-length feature film, made by Dadasaheb Phalke in 1913, was which one?","options":["Raja Harishchandra","Alam Ara","Pather Panchali","Mughal-e-Azam"],"correct":0,"trivia":"Raja Harishchandra (1913) was silent; Alam Ara (1931) was the first talkie."},{"id":9,"category":"Counting the Map","question":"How many states does India have today?","options":["28","29","25","31"],"correct":0,"trivia":"28 states and 8 union territories, since Jammu & Kashmir and Ladakh became UTs in 2019."},{"id":10,"category":"National Calendar","question":"India became a republic on 26 January 1950. Why that date?","options":["It marked 20 years since Purna Swaraj Day","It was Gandhi's birthday","The British chose it","It was Tagore's suggestion"],"correct":0,"trivia":"26 January was Purna Swaraj Day, first observed in 1930 - the republic honoured that promise."}]},{"id":"odisha-quiz-1","title":"Odisha: Our Home State","subtitle":"Records and wonders from the land of Jagannath","date":"28 October 2026","blurb":"Ten questions on the state that raised us, from the world's longest earthen dam to marching turtles.","questions":[{"id":1,"category":"Statehood","question":"Odisha became a separate province on 1 April 1936, a day now celebrated as what?","options":["Utkal Divas","Odisha Diwas","Kalinga Day","Swaraj Divas"],"correct":0,"trivia":"Utkal Divas marks the 1936 formation of Odisha as India's first province created on linguistic lines."},{"id":2,"category":"Engineering Marvel","question":"The Hirakud Dam across the Mahanadi near Sambalpur holds which world record?","options":["Longest earthen dam in the world","Tallest dam in Asia","Oldest dam in India","Largest dam by volume"],"correct":0,"trivia":"Hirakud is the longest earthen dam in the world, about 25.8 km with its dykes."},{"id":3,"category":"Lagoon of Wonders","question":"Chilika Lake in Odisha is the largest brackish water lagoon in Asia and which rank in the world?","options":["Second largest coastal lagoon","Largest coastal lagoon","Fifth largest","Tenth largest"],"correct":0,"trivia":"Chilika is Asia's largest and the world's second largest coastal lagoon, home to Irrawaddy dolphins."},{"id":4,"category":"Temple City","question":"Bhubaneswar's great Lingaraj Temple, dedicated to Shiva, was built in which century?","options":["11th century","5th century","16th century","19th century"],"correct":0,"trivia":"The Lingaraj Temple rose in the 11th century and still towers over the 'Temple City of India'."},{"id":5,"category":"March of the Turtles","question":"Gahirmatha beach in Odisha is the world's largest nesting site for which animal?","options":["Olive Ridley turtles","Saltwater crocodiles","Horseshoe crabs","Flamingos"],"correct":0,"trivia":"Hundreds of thousands of Olive Ridley turtles arrive at Gahirmatha for the arribada, the mass nesting."},{"id":6,"category":"Cave Story","question":"The Udayagiri and Khandagiri caves near Bhubaneswar were carved for Jain monks under which Kalinga king?","options":["Kharavela","Ashoka","Harsha","Anantavarman"],"correct":0,"trivia":"King Kharavela had them cut around the 1st century BCE; his Hathigumpha inscription tells his story."},{"id":7,"category":"The Flying Chief","question":"Which two-time Odisha chief minister was a legendary pilot who flew Indonesian leaders to safety in 1947?","options":["Biju Patnaik","Nandini Satpathy","Harekrushna Mahatab","Janaki Ballabh Patnaik"],"correct":0,"trivia":"Biju Patnaik dodged Dutch forces to fly out Indonesian leaders; Indonesia later gave him its highest civilian honour."},{"id":8,"category":"Into the Wild","question":"Simlipal in Mayurbhanj, famous for tigers and elephants, is protected as what?","options":["National park and tiger reserve","Bird sanctuary","Biosphere-free zone","Marine reserve"],"correct":0,"trivia":"Simlipal is a national park, tiger reserve and UNESCO-listed biosphere reserve."},{"id":9,"category":"Classical Grace","question":"Which classical dance form was born in Odisha's temples?","options":["Odissi","Kathak","Bharatanatyam","Mohiniyattam"],"correct":0,"trivia":"Odissi, one of India's oldest classical dances, grew out of temple ritual and sculpture."},{"id":10,"category":"Old Capital","question":"Before Bhubaneswar, which city was the capital of Odisha for nearly a thousand years?","options":["Cuttack","Puri","Sambalpur","Berhampur"],"correct":0,"trivia":"Cuttack served as capital for almost a millennium before Bhubaneswar took over in 1948."}]},{"id":"fun-trivia-2","title":"Just For Fun, Round 2","subtitle":"Ten more delightful oddities","date":"29 October 2026","blurb":"More useless knowledge you will definitely use at the reunion dinner table. One point each.","questions":[{"id":1,"category":"Crime Scene","question":"Which animal's fingerprints are so similar to humans' they could confuse a crime scene?","options":["Koala","Chimpanzee","Raccoon","Otter"],"correct":0,"trivia":"Koala prints are nearly indistinguishable from ours, even under an electron microscope."},{"id":2,"category":"Alphabet Soup","question":"What is the only letter that does not appear in any US state name?","options":["Q","Z","X","J"],"correct":0,"trivia":"Q is the missing one - even X (Texas, New Mexico) and Z (Arizona) make the cut."},{"id":3,"category":"Heavy Weather","question":"About how much does an average cumulus cloud weigh?","options":["500,000 kg","500 kg","50,000 kg","50 kg"],"correct":0,"trivia":"Half a million kilograms, says the USGS - roughly a hundred elephants floating overhead."},{"id":4,"category":"Dotty","question":"The little dot over a lowercase i or j is officially called a...","options":["Tittle","Jot","Point","Speck"],"correct":0,"trivia":"A tittle - hence the phrase 'every jot and tittle' for the smallest detail."},{"id":5,"category":"Slimy","question":"How many noses does a common garden slug have?","options":["Four","One","Two","None"],"correct":0,"trivia":"Four - two pairs of tentacles, the longer pair carrying eyes at the tips."},{"id":6,"category":"Hand Warmer","question":"Which silvery metal will melt right in the palm of your hand?","options":["Gallium","Mercury","Aluminium","Tin"],"correct":0,"trivia":"Gallium melts at about 29.8 C. Mercury is already liquid, so it cannot melt in your hand."},{"id":7,"category":"Lakes Forever","question":"Which country has more lakes than the rest of the world combined?","options":["Canada","Russia","Finland","Sweden"],"correct":0,"trivia":"Canada holds an estimated 62 percent of the world's lakes. Finland's 188,000 barely register."},{"id":8,"category":"True Colours","question":"Before Dutch growers popularised orange ones, most cultivated carrots were what colour?","options":["Purple","Orange","Red","Green"],"correct":0,"trivia":"Early carrots were purple and yellow; orange became dominant around the 17th century."},{"id":9,"category":"National Pride","question":"Scotland's official national animal is which mythical creature?","options":["The unicorn","The dragon","The griffin","The kelpie"],"correct":0,"trivia":"The unicorn has been a Scottish heraldic symbol for centuries - the national animal is genuinely a unicorn."},{"id":10,"category":"Bone Count","question":"At birth, humans have about how many bones (before some fuse together)?","options":["300","206","150","412"],"correct":0,"trivia":"Babies start with around 300 bones; many fuse into the 206 of the adult skeleton."}]},{"id":"bollywood-classics-1","title":"Bollywood Through the Ages","subtitle":"From Mother India to Chaiyya Chaiyya","date":"30 October 2026","blurb":"Ten questions on the films and songs that raised us, long before 2001. Singing along is encouraged.","questions":[{"id":1,"category":"The Big One","question":"Which 1975 film gave us Jai, Veeru, Basanti and Gabbar Singh?","options":["Sholay","Deewaar","Zanjeer","Amar Akbar Anthony"],"correct":0,"trivia":"Sholay ran for over five years in some theatres and still tops every greatest-film list."},{"id":2,"category":"Still Running","question":"Dilwale Dulhania Le Jayenge has played daily since 1995 at which Mumbai theatre?","options":["Maratha Mandir","Regal Cinema","Eros Cinema","Liberty Cinema"],"correct":0,"trivia":"Maratha Mandir hosts the world's longest film run - over 30 years and counting."},{"id":3,"category":"Oscar First","question":"Which Mehboob Khan epic was the first Indian film nominated for an Oscar?","options":["Mother India","Mughal-e-Azam","Naya Daur","Aan"],"correct":0,"trivia":"Mother India competed for Best Foreign Language Film at the 1958 Academy Awards."},{"id":4,"category":"Angry Young Man","question":"Which actor became the 'Angry Young Man' of the 1970s after Zanjeer and Deewaar?","options":["Amitabh Bachchan","Dharmendra","Vinod Khanna","Shatrughan Sinha"],"correct":0,"trivia":"Salim-Javed's scripts made Amitabh Bachchan the face of the era."},{"id":5,"category":"Top of the World","question":"The song Chaiyya Chaiyya from Dil Se was famously filmed where?","options":["On top of a moving train","On a beach in Goa","In the Himalayas","On a Mumbai rooftop"],"correct":0,"trivia":"SRK and Malaika danced on a moving Nilgiri Mountain Railway train, no green screen."},{"id":6,"category":"Maestro","question":"Who composed Sholay's unforgettable music, including Yeh Dosti?","options":["R.D. Burman","S.D. Burman","Laxmikant-Pyarelal","Kalyanji-Anandji"],"correct":0,"trivia":"R.D. Burman scored Sholay - and sang Mehbooba Mehbooba himself."},{"id":7,"category":"The Showman","question":"Which Kapoor, star of Awaara and Shree 420, was called the greatest showman of Indian cinema?","options":["Raj Kapoor","Shammi Kapoor","Shashi Kapoor","Prithviraj Kapoor"],"correct":0,"trivia":"Raj Kapoor's tramp character was loved from Moscow to Cairo."},{"id":8,"category":"The Epic","question":"Which 1960 K. Asif historical epic starred Dilip Kumar as Salim and Madhubala as Anarkali?","options":["Mughal-e-Azam","Pakeezah","Jodhaa Akbar","Taj Mahal"],"correct":0,"trivia":"Mughal-e-Azam took nearly a decade to make; its colourised re-release also filled theatres."},{"id":9,"category":"Guru's Masterpiece","question":"Which 1957 Guru Dutt classic about a poet gave us Jinhe Naaz Hai Hind Par Woh Kahaan Hain?","options":["Pyaasa","Kaagaz Ke Phool","Sahib Bibi Aur Ghulam","Awaara"],"correct":0,"trivia":"Pyaasa was a box-office hit then and a Sight and Sound all-time pick now."},{"id":10,"category":"The Debut","question":"Aamir Khan's first film as a leading man was which 1988 college romance?","options":["Qayamat Se Qayamat Tak","Dil","Jo Jeeta Wohi Sikandar","Raakh"],"correct":0,"trivia":"QSQT made overnight stars of Aamir and Juhi - and of the song Papa Kehte Hain."}]}]};

saveResult(Q[qi].id,sc,qs.length,qgid,qid2,name).then(st=>{saved=noteSave(st,{game:Q[qi].id,guard:'quiz:'+Q[qi].id,score:sc,total:qs.length,grid:qgid,id:qid2,name:name})==='ok'?'Score saved to the leaderboard.':'Could not save the score - it will retry automatically when you reopen this page.';loadBoard();render()})}
render()})();
/* LEADERBOARD */
(function(){const el=$('#lb');let rows;
window.loadLb=function(){el.innerHTML='<div class="card"><b>Leaderboard</b><p class="note">Loading…</p></div>';fetch(API).then(r=>r.json()).then(j=>{rows=j&&j.ok&&Array.isArray(j.rows)?j.rows:[];render()}).catch(()=>{rows=null;render()})};
function render(){if(rows===null){el.innerHTML='<div class="card"><b>Leaderboard</b><p class="note">Leaderboard unavailable right now.</p></div>';return}if(!rows)return;
const seen=new Set(),P=new Map();
[...rows].sort((a,b)=>((+a.at||+a.time||0)-(+b.at||+b.time||0))).forEach(r=>{const nk=String(r.name||'').trim().replace(/\s+/g,' ');const rt=+r.at||+r.time||0;if(!nk)return;const k=nk.toLowerCase();const g=String(r.quiz||'');const ty=g.split('@')[0];const dk=k+'|'+g;if(seen.has(dk))return;seen.add(dk);if(!(rt>=LAUNCH))return;const pts=pointsFor(ty,String(r.score));let p=P.get(k);if(!p){p={name:nk,wordle:0,detective:0,weave:0,quiz:0,total:0};P.set(k,p)}if(ty==='wordle')p.wordle+=pts;else if(ty==='detective')p.detective+=pts;else if(ty==='weave')p.weave+=pts;else p.quiz+=pts;p.total+=pts});
const l=[...P.values()].sort((a,b)=>b.total-a.total);
let h='<div class="card"><b>Leaderboard · total points</b><p class="note">Wordle 6-1 by try · Detective 5-1 by hint · Weave 5 + speed bonus · Quiz 1 per correct. Max 28 a day. Only the first attempt at each puzzle counts. Points started 20 October; older quiz scores stay on their own leaderboards.</p>';
if(!l.length)h+='<p class="note">No scores yet. Be the first!</p>';
else h+='<table><tr><th>#</th><th>Name</th><th>Wdl</th><th>Det</th><th>Wve</th><th>Quiz</th><th>Total</th></tr>'+l.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+escH(p.name)+'</td><td>'+(p.wordle||'')+'</td><td>'+(p.detective||'')+'</td><td>'+(p.weave||'')+'</td><td>'+(p.quiz||'')+'</td><td><b>'+p.total+'</b></td></tr>').join('')+'</table>';
h+='</div>';el.innerHTML=h}
})();
