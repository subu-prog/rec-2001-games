const D={"date":"23 October 2026","wordle":{"answer":"AMRUTA","registered":["ABHINAV","AJAY","AMIT","AMRUTA","ANUJ","APURBA","ARUN","BALPREET","CHANDRIKA","CHITTA","DEBA","DEBASHIS","DEEPANJAN","DEVENDRA","DIPANWITA","DIVYARAJSINH","GAUTAM","GIRIJA","JOYDEEP","KARTHIK","KIREET","KULBHUSHAN","MALAY","MAMATA","MANAS","MANISH","MANOJ","NIVEDITA","PARIMITA","PRABHJOT","PRADEEP","PRAKASH","PRASANTA","PRAVEEN","PUJA","RAGHAVENDRAN","RAKHI","RASHMI","ROHIT","RONITA","SAGAR","SANDEEP","SANTOSH","SATYA","SEEMA","SHIV","SHOBHIT","SOMA","SRINIVASA","SUBHADRA","SUBHANKAR","SUDHIRA","SUJIT","SUMANTA","SUNITI","SWATI","SWAYAM","SWETHA","VEERA","YOGESH"]},"detective":{"ans":"Chandrika","ok":["chandrika"],"hints":["This name does its best work after sunset.","From Sanskrit candrika, it means moonlight, illumination, splendour.","The root is chandra, the moon - the same root behind Chandni and Chandramukhi.","Sri Lanka's first woman president, Chandrika Kumaratunga, carried this name.","Nine letters. You will hear it in Hindi, Odia, Bengali, Telugu, Malayalam, Tamil and Sinhalese homes."],"note":"Chandrika comes from Sanskrit candrika ('moonlight, illumination, splendour'), built on chandra, the moon. Chandrika Kumaratunga, Sri Lanka's president from 1994 to 2005, is its best-known bearer.","sourceNote":"These clues explain the name's meaning, not the batchmate's personality.","sources":[{"label":"Behind the Name: Chandrika","url":"https://www.behindthename.com/name/chandrika"}]},"weave":{"words":[{"w":"MAMATA","clue":"Love and affection: from Sanskrit mamata, the tenderness that calls someone 'mine'."},{"w":"APURBA","clue":"Unprecedented and new: the Bengali-Odia form of Sanskrit apurva, one of a kind."},{"w":"MANOJ","clue":"Born of the mind: manas + ja, another name of Kama, the god of love."},{"w":"ANUJ","clue":"Born later: the classic name for a younger brother."}],"grid":["MAAAMAN","ATPBAJU","MAURNOJ"],"note":"Mamata: love, affection. Apurba: unprecedented, new. Manoj: born of the mind, a name of Kama. Anuj: born later, the younger brother. These meanings describe names, not people."},"quizzes":[{"id":"tech-trivia-1","title":"404 Dignity Not Found","subtitle":"The Ultimate Tech & Internet Trivia","date":"15 October 2026","blurb":"Ten absurd, iconic and true questions from tech and internet history.","questions":[{"id":1,"category":"Search Wars","question":"What has historically been the single most-searched word on Microsoft's Bing search engine?","options":["Google","Facebook","Weather","YouTube"],"correct":0,"trivia":"Google's legal team actually submitted this data in European Union antitrust court to prove that consumers choose Google by conscious preference, not because of default browser dominance! (This was Google's claim in its 2021 EU court filing.)"},{"id":2,"category":"Viral Origins","question":"What iconic pop-culture moment in 2000 caused Google engineers to hurriedly invent Google Image Search?","options":["Jennifer Lopez's green Versace Grammy dress","Britney Spears dancing with an albino Python","The launch of the colorful translucent iMacs","The Dot-Com crash front-page headlines"],"correct":0,"trivia":"Former Google CEO Eric Schmidt confirmed that J.Lo's plunging green dress was the most popular search query they had ever seen, but users were frustrated that results were just text links. Image search was born!"},{"id":3,"category":"Branding Blunders","question":"When Larry Page and Sergey Brin started building their search engine in 1996 at Stanford, what was its original name?","options":["BackRub","PageRank Express","The Web Crawler","BrainSoup"],"correct":0,"trivia":"It was called 'BackRub' because the core algorithm analyzed backlinks across the web to gauge site importance. Be glad you don't have to tell your coworkers to 'BackRub that recipe'."},{"id":4,"category":"Hardware Hacks","question":"Why was the world's very first webcam set up by researchers at Cambridge University in 1991?","options":["To monitor a coffee pot so they didn't walk to an empty pot","To catch someone stealing computer components","To livestream a student's high-tech hamster cage","To observe server room temperature gauges"],"correct":0,"trivia":"Known as the 'Trojan Room coffee pot', a camera pointed at it let Cambridge computer scientists check the pot from their desks, so nobody wasted a trip down the corridor for an empty one. It is widely credited as the world's first webcam."},{"id":5,"category":"Silicon Valley Lore","question":"What was Jeff Bezos's original choice for Amazon's company name before his lawyer misheard it?","options":["Cadabra","Relentless","EarthBooks","EveryDepot"],"correct":0,"trivia":"Bezos loved 'Cadabra' (as in abracadabra), but when his lawyer misheard it as 'Cadaver' (a dead corpse), Bezos reconsidered. He also bought Relentless.com—which still redirects straight to Amazon today!"},{"id":6,"category":"Apple Ruthlessness","question":"How did Steve Jobs prove to Apple engineers that the original iPod prototype could still be made smaller?","options":["He dropped it in a fish tank and pointed to air bubbles","He ran it over with his silver Mercedes SL55","He sliced its casing open with a chef's knife","He tossed it out a boardroom window into a fountain"],"correct":0,"trivia":"As the story goes, Jobs dropped the prototype into an aquarium in front of his engineers. When bubbles floated up, he pointed out that air bubbles meant empty space, and told them to make it smaller. This is a much-repeated anecdote, not a documented record."},{"id":7,"category":"E-Commerce Roots","question":"In 1995, Pierre Omidyar launched eBay (then AuctionWeb). What was the very first item ever sold?","options":["A broken laser pointer for $14.83","A half-eaten grilled cheese sandwich","A vintage Superman comic book","A box of floppy disks with Windows 95"],"correct":0,"trivia":"Omidyar was so astonished that he emailed the winning bidder to verify if he understood the laser pointer was broken. The buyer, as the tale is usually told, collected broken laser pointers."},{"id":8,"category":"The ARPANET Crash","question":"In 1969, the first ARPANET message (the precursor to the Internet) was meant to be 'LOGIN'. What was actually sent before it crashed?","options":["LO","HELLO","LOG","404"],"correct":0,"trivia":"Programmer Charley Kline typed 'L' (confirmed by telephone), then 'O' (confirmed), and on the letter 'G', the SDS Sigma 7 mainframe crashed! The first internet message was literally 'LO' (as in 'Lo and behold')."},{"id":9,"category":"Video Streaming","question":"What was the very first video uploaded to YouTube on April 23, 2005?","options":["\"Me at the zoo\" (Jawed Karim at the elephant exhibit)","\"Keyboard Cat takes the stage\"","\"Test Video #1: Roommate with guitar\"","\"Office Tour in San Mateo, California\""],"correct":0,"trivia":"The short video features YouTube co-founder Jawed Karim remarking that elephants 'have really, really, really long trunks, and that's cool.' It is recognized as the first video uploaded to YouTube."},{"id":10,"category":"The Ultimate Blunder","question":"In the late 1990s, Larry and Sergey tried to sell Google's search technology to a rival portal so they could finish their PhDs. About how much were they reportedly asking?","options":["$1 Million","$10 Million","$500,000","$100,000"],"correct":0,"trivia":"Reports say the founders offered Google for about $1 million to portals such as Excite and AltaVista, and nobody bought. Excite's backer Vinod Khosla later said the price had come down to under $1 million. In 2002, Yahoo offered roughly $3 billion for Google, and Google declined."}]},{"id":"india-quiz-1","title":"Incredible India","subtitle":"The Great India Quiz","date":"19 October 2026","blurb":"Ten questions on India's places, firsts, words and wonders, with a couple straight from Odisha.","questions":[{"id":1,"category":"Wild India","question":"The entire wild population of Asiatic lions lives in just one place on Earth. Where?","options":["Gir National Park, Gujarat","Ranthambore National Park, Rajasthan","Kaziranga National Park, Assam","Bandhavgarh National Park, Madhya Pradesh"],"correct":0,"trivia":"Gir in Gujarat is the last home of the Asiatic lion. From barely a dozen left in the early 1900s, careful protection brought the count to 891 lions in the 2025 census."},{"id":2,"category":"The Constitution","question":"How many languages are officially recognised in the Eighth Schedule of the Indian Constitution?","options":["22","18","15","29"],"correct":0,"trivia":"The schedule started with 14 languages in 1950. Sindhi joined in 1967, Konkani, Manipuri and Nepali in 1992, and Bodo, Dogri, Maithili and Santali took it to 22 in 2003."},{"id":3,"category":"Space","question":"In August 2023, Chandrayaan-3 made India the first country to land a spacecraft near which part of the Moon?","options":["The south polar region","The north pole","The far side's equator","The Sea of Tranquility"],"correct":0,"trivia":"India also became the fourth nation to soft-land on the Moon, after the Soviet Union, the United States and China. The south polar region is prized for its frozen water."},{"id":4,"category":"Mathematics","question":"Which ancient Indian mathematician's 628 CE text Brahmasphutasiddhanta first treated zero as a number with its own arithmetic rules?","options":["Brahmagupta","Aryabhata","Bhaskara II","Panini"],"correct":0,"trivia":"Brahmagupta defined zero as the result of subtracting a number from itself, then wrote rules for adding, subtracting and multiplying with it. He even tried dividing by zero."},{"id":5,"category":"Olympics","question":"Abhinav Bindra won India's first individual Olympic gold medal, at Beijing 2008, in which sport?","options":["Shooting","Wrestling","Boxing","Badminton"],"correct":0,"trivia":"His near-perfect 10.8 on the last shot of the 10m air rifle final edged out China's Zhu Qinan. India's eight earlier hockey golds were all team events."},{"id":6,"category":"Engineering Marvels","question":"The Chenab Bridge, the world's highest railway bridge at 359 metres above the riverbed, stands in which Indian union territory?","options":["Jammu and Kashmir","Himachal Pradesh","Uttarakhand","Arunachal Pradesh"],"correct":0,"trivia":"The steel arch bridge in Reasi district stands taller than the Eiffel Tower and carries trains on the line into the Kashmir Valley."},{"id":7,"category":"Odisha","question":"The Konark Sun Temple, a UNESCO World Heritage Site, was built as a giant stone chariot of which deity?","options":["Surya, the Sun God","Vishnu","Shiva","Indra"],"correct":0,"trivia":"The 13th-century temple chariot is pulled by seven horses on 24 carved wheels, each about 3 metres across, marking the cycle of months."},{"id":8,"category":"Odisha","question":"Rourkela, our own reunion city, got India's first public sector integrated steel plant in the 1950s, built with collaboration from which country?","options":["West Germany","The Soviet Union","The United Kingdom","Japan"],"correct":0,"trivia":"Rourkela Steel Plant began production in 1959 with a consortium led by German firms Krupp and Demag. Bhilai got the Soviet plant and Durgapur the British one."},{"id":9,"category":"Words","question":"The English word 'juggernaut', meaning an unstoppable force, comes from which Odisha tradition?","options":["The Jagannath Rath Yatra of Puri","The Durga Puja of Kolkata","The Kumbh Mela of Prayagraj","The Mysuru Dasara procession"],"correct":0,"trivia":"British observers in the early 1800s watched Lord Jagannath's massive chariot roll through Puri and turned 'Jagannath' into 'juggernaut'."},{"id":10,"category":"Firsts","question":"Who was the first Indian to travel to space?","options":["Rakesh Sharma","Kalpana Chawla","Sunita Williams","Ravish Malhotra"],"correct":0,"trivia":"Squadron Leader Rakesh Sharma flew aboard the Soviet Soyuz T-11 in April 1984; Ravish Malhotra trained as his backup. Asked how India looked from space, Sharma replied: Sare Jahan Se Accha."}]},{"id":"dussehra-quiz-1","title":"Dussehra Quiz","subtitle":"Ravana, Rama and the festival of victory","date":"20 October 2026","blurb":"Ten questions on Dussehra: the story, the bonfires and the great celebrations.","questions":[{"id":1,"category":"The Big Story","question":"Dussehra (Vijayadashami) celebrates Lord Rama's victory over which king?","options":["Ravana","Kansa","Hiranyakashipu","Mahishasura"],"correct":0,"trivia":"Rama defeated the ten-headed Ravana of Lanka, who had abducted Sita. The day stands for good winning over evil."},{"id":2,"category":"Ten Heads","question":"Ravana is also called Dashanana. How many heads does that name refer to?","options":["Ten","Seven","Nine","Twelve"],"correct":0,"trivia":"Dasha means ten and anana means face. Many people also read Dussehra as Dasha-hara, the removal of the ten heads."},{"id":3,"category":"The Bonfire","question":"Along with Ravana, which two effigies are traditionally burned on Dussehra evening?","options":["Kumbhakarna and Meghnad","Vibhishana and Hanuman","Sugriva and Angad","Jatayu and Sampati"],"correct":0,"trivia":"Ravana's brother Kumbhakarna and son Meghnad (Indrajit) stand beside him in the great effigies of Ramlila grounds."},{"id":4,"category":"The Turncoat","question":"Which of Ravana's brothers sided with Rama?","options":["Vibhishana","Kumbhakarna","Khara","Maricha"],"correct":0,"trivia":"Vibhishana advised Ravana to return Sita, was turned away, and joined Rama. Rama later crowned him king of Lanka."},{"id":5,"category":"Royal Parade","question":"Which city is famed for its ten-day royal Dasara, ending with a procession of decorated elephants?","options":["Mysuru","Jaipur","Udaipur","Hyderabad"],"correct":0,"trivia":"Mysuru's Dasara, centred on the Mysore Palace and the Jamboo Savari procession, is among India's most famous festivals."},{"id":6,"category":"Hill Festival","question":"In which state does the Kullu Dussehra begin on Vijayadashami and go on for about a week?","options":["Himachal Pradesh","Uttarakhand","Jammu and Kashmir","Sikkim"],"correct":0,"trivia":"While Ravana is being burned elsewhere, Kullu's festival begins, with hundreds of village deities brought to honour Lord Raghunath."},{"id":7,"category":"The Epic","question":"In which language did Tulsidas write the Ramcharitmanas, the retelling of the Ramayana performed in many Ramlilas?","options":["Awadhi","Maithili","Braj Bhasha","Bengali"],"correct":0,"trivia":"Tulsidas wrote it in the 16th century in Awadhi, which is why it reached ordinary homes across northern India."},{"id":8,"category":"World Recognition","question":"In 2008 UNESCO added which Dussehra-season tradition, the staged performance of the Ramayana, to its Intangible Cultural Heritage list?","options":["Ramlila","Yakshagana","Kuchipudi","Pandavani"],"correct":0,"trivia":"Ramlila is performed over several nights before Dussehra, and the story ends with Ravana's defeat."},{"id":9,"category":"Durga Time","question":"In 2021 UNESCO inscribed the Durga Puja of which city on its Intangible Cultural Heritage list?","options":["Kolkata","Guwahati","Cuttack","Patna"],"correct":0,"trivia":"Kolkata's Durga Puja was recognised for its community pandals, idol making and art."},{"id":10,"category":"Odisha Special","question":"Which Odisha city, close to the Mahanadi, is famed for Durga Puja decorations made in silver filigree (tarakasi)?","options":["Cuttack","Sambalpur","Berhampur","Balasore"],"correct":0,"trivia":"Cuttack's Durga Puja is known for its silver filigree work, and the city is also known as the silver city."}]},{"id":"bollywood-quiz-2001","title":"Class of 2001: The Year in Bollywood","subtitle":"The year you graduated, on the silver screen","date":"21 October 2026","blurb":"Ten questions from the Bollywood of 2001 - the year our batch walked out of REC.","questions":[{"id":1,"category":"The Great Clash","question":"Two of 2001's biggest films released on the very same day, 15 June 2001. Which pair?","options":["Lagaan and Gadar: Ek Prem Katha","Dil Chahta Hai and Kabhi Khushi Kabhie Gham","Lagaan and Dil Chahta Hai","Gadar and Kabhi Khushi Kabhie Gham"],"correct":0,"trivia":"Lagaan and Gadar opened on 15 June 2001. Gadar powered ahead at the box office while Lagaan took the awards road all the way to the Oscars."},{"id":2,"category":"The Oscars","question":"Lagaan was only the third Indian film ever nominated for the Oscar for Best Foreign Language Film. Which two came before it?","options":["Mother India and Salaam Bombay!","Guide and Pather Panchali","Mughal-e-Azam and Pyaasa","Shwaas and Harishchandrachi Factory"],"correct":0,"trivia":"Mother India (1957) and Salaam Bombay! (1988) were the earlier two. Lagaan remains, as of 2025, the most recent Indian nominee in the category."},{"id":3,"category":"Cricket and Taxes","question":"In Lagaan, what must Bhuvan's villagers win to escape paying lagaan (tax) for three years?","options":["A cricket match against the British officers","A wrestling bout with Captain Russell","A harvest race against the neighbouring village","A kabaddi final at the cantonment"],"correct":0,"trivia":"Set in 1893, the film turns on Captain Russell's arrogant bet: beat his team at cricket and the tax goes for three years, lose and it triples."},{"id":4,"category":"Directors' Debuts","question":"Dil Chahta Hai (August 2001), the film that redefined friendship on screen, was whose directorial debut?","options":["Farhan Akhtar","Zoya Akhtar","Karan Johar","Nikhil Advani"],"correct":0,"trivia":"Farhan Akhtar wrote and directed it for the newly formed Excel Entertainment, with Ritesh Sidhwani producing. It released on 10 August 2001."},{"id":5,"category":"The Music","question":"Dil Chahta Hai's era-defining soundtrack was composed by which music trio?","options":["Shankar-Ehsaan-Loy","Vishal-Shekhar","Jatin-Lalit","Nadeem-Shravan"],"correct":0,"trivia":"The trio had composed before, but Dil Chahta Hai made Shankar-Ehsaan-Loy a household name for a whole generation."},{"id":6,"category":"Family Drama","question":"In Kabhi Khushi Kabhie Gham (December 2001), Amitabh and Jaya Bachchan play Yash and Nandini Raichand. Who plays their elder son Rahul?","options":["Shah Rukh Khan","Hrithik Roshan","Saif Ali Khan","Abhishek Bachchan"],"correct":0,"trivia":"Hrithik Roshan plays the younger son Rohan, and Kajol plays Rahul's love, Anjali."},{"id":7,"category":"Partition Epic","question":"Gadar: Ek Prem Katha, the year's biggest blockbuster, is set during which historical event?","options":["The Partition of India in 1947","The 1971 war","The revolt of 1857","The Emergency of 1975"],"correct":0,"trivia":"Sunny Deol's Tara Singh and that uprooted hand pump became instant legend; the love story unfolds across the Partition."},{"id":8,"category":"National Awards","question":"Which 2001 film won the National Film Award for Best Popular Film Providing Wholesome Entertainment?","options":["Lagaan","Gadar","Dil Chahta Hai","Kabhi Khushi Kabhie Gham"],"correct":0,"trivia":"At the 49th National Film Awards, Lagaan swept eight awards, including Best Popular Film."},{"id":9,"category":"Critical Acclaim","question":"Tabu won the National Film Award for Best Actress for which gritty 2001 Madhur Bhandarkar film?","options":["Chandni Bar","Astitva","Page 3","Corporate"],"correct":0,"trivia":"She shared the award with Shobana (Mitr, My Friend). Chandni Bar also won Best Film on Other Social Issues, plus both supporting-actor prizes."},{"id":10,"category":"Star Launch","question":"Which 2001 film launched Tusshar Kapoor, son of Jeetendra, opposite Kareena Kapoor?","options":["Mujhe Kucch Kehna Hai","Yaadein","Ajnabee","Pyaar Tune Kya Kiya"],"correct":0,"trivia":"Mujhe Kucch Kehna Hai released on 25 May 2001; Tusshar's screen career starts right there, in your graduation year."}]},{"id":"rec-quiz-1","title":"REC Rourkela Quiz","subtitle":"The college we called home","date":"23 October 2026","blurb":"Ten questions on our very own REC: the campus, the history and the legends of Rourkela.","questions":[{"id":1,"category":"Founding Day","question":"REC Rourkela was established on which date?","options":["15 August 1961","26 January 1960","15 August 1965","2 October 1961"],"correct":0,"trivia":"The college began on Independence Day 1961 - it shares its birthday with the nation."},{"id":2,"category":"The Stone","question":"Who laid the foundation stone of REC Rourkela?","options":["Jawaharlal Nehru","Dr. S. Radhakrishnan","Biju Patnaik","Dr. Homi Bhabha"],"correct":0,"trivia":"India's first Prime Minister laid the foundation stone of our campus."},{"id":3,"category":"The Gift of Land","question":"Which Chief Minister of Odisha provided the land, roughly 650 acres, for the college?","options":["Biju Patnaik","Nandini Satpathy","Harekrushna Mahatab","Nilamani Routray"],"correct":0,"trivia":"Biju Patnaik gave the land; the central library, functional since 1965, is also named after him."},{"id":4,"category":"National Importance","question":"In which year was NIT Rourkela declared an Institute of National Importance by an Act of Parliament?","options":["2007","2002","1961","2010"],"correct":0,"trivia":"The NIT Act 2007 gave all NITs a common statutory framework; ours was declared on 15 August 2007."},{"id":5,"category":"Name Change","question":"REC Rourkela was renamed National Institute of Technology on 26 June of which year?","options":["2002","2003","2001","2005"],"correct":0,"trivia":"We graduated as RECians in 2001; the college became NIT Rourkela the very next year, on 26 June 2002."},{"id":6,"category":"The REC Family","question":"How many Regional Engineering Colleges were rechristened as NITs?","options":["17","8","31","12"],"correct":0,"trivia":"Seventeen RECs became NITs; the family has since grown to 31 NITs across India."},{"id":7,"category":"Steel City","question":"REC/NIT Rourkela sits in a city famous for which industry?","options":["Steel","Textiles","Tea","Shipbui if(phase==='intro'){h='<div class="card"><b>'+q.title+'</b><p class="sub">'+q.subtitle+'</p><label class="note">Quiz <select id="qsel">'+[...Q].map((x,i)=>[x,i]).reverse().map(([x,i])=>'<option value="'+i+'"'+(i===qi?' selected':'')+'>'+x.title+' · '+x.date+'</option>').join('')+'</select></label><p>'+q.blurb+' '+q.questions.length+' questions, one point each. Options are shuffled every round.</p><p class="note">Your name and score show on a public leaderboard, and points count toward the total leaderboard.</p>'+(PLAYER.get()?'<p>Playing as <b>'+esc(PLAYER.get())+'</b> <span class="note">(change it at the top of the page)</span></p>':'<input type="text" id="qn" maxlength="40" placeholder="Your full name (required)" value="'+esc(name)+'">')+(played('quiz:'+q.id)?'<p class="note">You already played this quiz - replay for practice; the score will not be saved.</p>':'')+'<p><button class="b" id="qgo">Start quiz</button></p><div class="msg">'+msg+'</div></div><div class="card"><b>Leaderboard · '+q.title+'</b>'+board()+'</div>'}
else if(phase==='play'){const x=qs[idx],sc=ans.filter(Boolean).length;h='<div class="card"><div class="note">Question '+(idx+1)+' of '+qs.length+' · '+esc(name)+': '+sc+' right</div><div class="bar"><span style="width:'+(((idx+(picked!==null?1:0))/qs.length)*100)+'%"></span></div><div class="note">'+x.category+'</div><h2 style="font-size:18px;margin:6px 0">'+x.question+'</h2>'+x.options.map((o,i)=>'<button class="opt '+(picked===null?'':i===x.correct?'right':i===picked?'wrong':'dim')+'" data-o="'+i+'" '+(picked!==null?'disabled':'')+'><b>'+(picked!==null&&i===x.correct?'✓':picked===i?'✕':LT[i])+'</b> &nbsp;'+o+'</button>').join('');
if(picked!==null)h+='<p><b>'+(picked===x.correct?'Correct.':'Not quite.')+'</b> '+x.trivia+'</p><button class="b" id="qnx">'+(idx===qs.length-1?'See final scorecard':'Next question')+'</button>';h+='</div>'}
else{const sc=ans.filter(Boolean).length,grid=ans.map(a=>a?'🟩':'🟥').join(''),res='REC 2001 · '+q.title+'\n'+name+' scored '+sc+'/'+qs.length+'\n'+grid+'\nThink you can beat it?\n'+PAGE;
h='<div class="card"><h2 style="font-size:32px;margin:0">'+sc+'/'+qs.length+'</h2><p>'+grid+'</p><p>'+(sc===qs.length?'Perfect round.':sc>=qs.length*.7?'Strong run.':sc>=qs.length*.4?'Respectable.':'Better luck next time.')+' You earned '+sc+' point'+(sc===1?'':'s')+'.</p><textarea rows="5" readonly>'+esc(res)+'</textarea><p><button class="b" id="qcp">Copy result</button> <a class="wa" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(safe(res))+'" data-p="'+encodeURIComponent(res)+'">Share on WhatsApp</a> <button class="s" id="qag">Play again</button></p><p class="note">'+saved+'</p><details><summary>Review answers</summary>'+qs.map((x,i)=>'<p>'+(ans[i]?'🟩':'🟥')+' <b>'+x.question+'</b><br>Answer: '+x.options[x.correct]+'<br><span class="note">'+x.trivia+'</span></p>').join('')+'</details></div><div class="card"><b>Leaderboard · '+q.title+'</b>'+board()+'</div>'}
el.innerHTML=h;
const s=$('#qsel');if(s)s.onchange=()=>{qi=+s.value;render()};const g=$('#qgo');if(g){g.onclick=start;const qn=$('#qn');if(qn)qn.onkeydown=e=>{if(e.key==='Enter')start()}}
el.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{if(picked!==null)return;picked=+b.dataset.o;ans.push(picked===qs[idx].correct);render()});
const n=$('#qnx');if(n)n.onclick=next;const c=$('#qcp');if(c)c.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(el.querySelector('textarea').value);c.textContent='Copied'};const a=$('#qag');if(a)a.onclick=()=>{phase='intro';render()}}
function start(){const n=(PLAYER.get()||($('#qn')?$('#qn').value.trim():'')).replace(/\s+/g,' ').slice(0,40);if(!n){msg='Enter your name first.';return render()}name=n;msg='';qs=prep(Q[qi]);idx=0;picked=null;ans=[];phase='play';render();scrollTo(0,0)}
function next(){if(idx<qs.length-1){idx++;picked=null;return render()}const sc=ans.filter(Boolean).length;
if(played('quiz:'+Q[qi].id)){saved='Practice round - your first attempt already counted.';phase='done';render();return}markPlayed('quiz:'+Q[qi].id);const qgid=ans.map(a=>a?'🟩':'🟥').join(''),qid2=newId();saved='Saving your score…';phase='done';render();
saveResult(Q[qi].id,sc,qs.length,qgid,qid2,name).then(st=>{saved=noteSave(st,{game:Q[qi].id,guard:'quiz:'+Q[qi].id,score:sc,total:qs.length,grid:qgid,id:qid2,name:name})==='ok'?'Score saved to the leaderboard.':'Could not save the score - it will retry automatically when you reopen this page.';loadBoard();render()})}
render()})();
/* LEADERBOARD */
(function(){const el=$('#lb');let rows;
window.loadLb=function(){el.innerHTML='<div class="card"><b>Leaderboard</b><p class="note">Loading…</p></div>';fetch(API).then(r=>r.json()).then(j=>{rows=j&&j.ok&&Array.isArray(j.rows)?j.rows:[];render()}).catch(()=>{rows=null;render()})};
function render(){if(rows===null){el.innerHTML='<div class="card"><b>Leaderboard</b><p class="note">Leaderboard unavailable right now.</p></div>';return}if(!rows)return;
const seen=new Set(),P=new Map();
[...rows].sort((a,b)=>((+a.at||+a.time||0)-(+b.at||+b.time||0))).forEach(r=>{const nk=String(r.name||'').trim().replace(/\s+/g,' ');const rt=+r.at||+r.time||0;if(!nk)return;const k=nk.toLowerCase();const g=String(r.quiz||'');const ty=g.split('@')[0];const dk=k+'|'+g;if(seen.has(dk))return;seen.add(dk);if(!(rt>=LAUNCH))return;const pts=pointsFor(ty,String(r.score));let p=P.get(k);if(!p){p={name:nk,wordle:0,detective:0,weave:0,quiz:0,total:0};P.set(k,p)}if(ty==='wordle')p.wordle+=pts;else if(ty==='detective')p.detective+=pts;else if(ty==='weave')p.weave+=pts;else p.quiz+=pts;p.total+=pts});
const l=[...P.values()].sort((a,b)=>b.total-a.total);
let h='<div class="card"><b>Leaderboard · total points</b><p class="note">Wordle 6-1 by try · Detective 5-1 by hint · Weave 5 + speed bonus · Quiz 1 per correct. Max 28 a day. Only the first attempt at each puzzle counts. Points started 20 October; older quiz scores stay on their own leaderboards.</p>';
if(!l.length)h+='<p class="note">No scores yet. Be the first!</p>';
else h+='<table><tr><th>#</th><th>Name</th><th>Wdl</th><th>Det</th><th>Wve</th><th>Quiz</th><th>Total</th></tr>'+l.map((p,i)=>'<tr><td>'+(i+1)+'</td><td>'+escH(p.name)+'</td><td>'+(p.wordle||'')+'</td><td>'+(p.detective||'')+'</td><td>'+(p.weave||'')+'</td><td>'+(p.quiz||'')+'</td><td><b>'+p.total+'</b></td></tr>').join('')+'</table>';
h+='</div>';el.innerHTML=h}
})();
</script></body></html>
